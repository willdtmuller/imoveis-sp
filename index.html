function mapsLink(p){ return `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`; }
function waLink(p){ return p.corretor_tel ? `https://wa.me/${p.corretor_tel}` : null; }
function calLink(p){
  if(!p.visita_inicio) return null;
  const start=new Date(p.visita_inicio), end=new Date(start.getTime()+(p.visita_min||45)*60000);
  const fmt=d=>d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')
    +'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
  const q=new URLSearchParams({action:'TEMPLATE',text:`Visita imóvel — ${p.bairro}`,
    dates:`${fmt(start)}/${fmt(end)}`,details:`Corretor: ${p.corretor_nome||''}\n${p.link||''}`,
    location:p.endereco||'',ctz:'America/Sao_Paulo'});
  return `https://calendar.google.com/calendar/render?${q.toString()}`;
}
function fmtVisita(p){
  if(!p.visita_inicio) return '—';
  return new Date(p.visita_inicio).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function formatTel(t){ const m=String(t).match(/^55(\d{2})(\d{4,5})(\d{4})$/); return m?`(${m[1]}) ${m[2]}-${m[3]}`:t; }

/* --- export CSV (importável no Google Sheets) --- */
function exportCSV(){
  const cols=['Corretor','Telefone','Bairro','Endereço','Área (m²)','Quartos','Infra','Custo total (R$)',
    'Visita','Data/hora visita','Link agenda','Proposta','Comentários','Link anúncio','Link Maps'];
  const rows=props.map(p=>[p.corretor_nome||'',p.corretor_tel||'',p.bairro||'',p.endereco||'',
    p.area_m2??'',p.quartos??'',(p.infra||[]).join('; '),p.custo_total??'',p.visita?'Sim':'Não',
    p.visita?fmtVisita(p):'',calLink(p)||'',p.proposta||'',p.comentarios||'',p.link||'',mapsLink(p)]);
  const esc=v=>`"${String(v).replace(/"/g,'""')}"`;
  const csv='\uFEFF'+[cols,...rows].map(r=>r.map(esc).join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));
  a.download=`imoveis-sp-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

function initMap(){
  const center=props.length?[props.reduce((s,p)=>s+p.lat,0)/props.length,props.reduce((s,p)=>s+p.lng,0)/props.length]:[-23.561,-46.69];
  map=L.map('map',{zoomControl:true}).setView(center,13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
  // espalha levemente pins que caem na mesma coordenada para não se sobreporem
  const seen={};
  props.forEach(p=>{
    const key=`${p.lat.toFixed(5)},${p.lng.toFixed(5)}`;
    const n=(seen[key]=(seen[key]||0)+1)-1;
    let lat=p.lat, lng=p.lng;
    if(n>0){ const ang=n*2.399963, r=0.0006*Math.ceil(n/6); lat+=r*Math.cos(ang); lng+=r*Math.sin(ang); }
    const icon=L.divIcon({className:'',html:`<div class="price-pin ${p.visita?'visited':''}">${BRL.format(p.custo_total)}</div>`,iconSize:[0,0]});
    const m=L.marker([lat,lng],{icon}).addTo(map);
    m.bindPopup(popupHTML(p),{closeButton:false,offset:[0,-6]});
    m.on('mouseover',()=>m.openPopup());
  });
}
function popupHTML(p){
  return `<div class="pin-card">
    <div class="pc-top">
      <div class="pc-bairro">${p.bairro}</div>
      <div class="pc-addr">${p.endereco.split(' - ')[0]}</div>
      <div class="pc-meta"><span>${p.area_m2} m²</span><span>${p.quartos} qto${p.quartos>1?'s':''}</span><span>${p.visita?'✓ visita':'sem visita'}</span></div>
    </div>
    <div class="pc-total"><span class="lbl">Pacote</span><span class="val">${BRL.format(p.custo_total)}</span></div>
    <div class="pc-open" onclick="openDetail('${p.id}')">Ver detalhes →</div>
  </div>`;
}

const COLS=[
  {k:'bairro',label:'Bairro / Endereço',sort:p=>p.bairro},
  {k:'area_m2',label:'m²',sort:p=>p.area_m2},
  {k:'quartos',label:'Qtos',sort:p=>p.quartos},
  {k:'infra',label:'Infra'},
  {k:'custo_total',label:'Pacote',sort:p=>p.custo_total},
  {k:'visita',label:'Visita',sort:p=>p.visita?1:0},
  {k:'proposta',label:'Proposta'}
];
let sortKey='custo_total',sortDir=1;
function buildHead(){
  document.getElementById('thead-row').innerHTML=COLS.map(c=>{
    const on=c.k===sortKey?'sorted':'';
    const arr=c.sort?`<span class="arr">${c.k===sortKey?(sortDir>0?'▲':'▼'):'⇅'}</span>`:'';
    return `<th class="${c.sort?'sortable':''} ${on}" ${c.sort?`onclick="sortBy('${c.k}')"`:''}>${c.label}${arr}</th>`;
  }).join('');
}
function sortBy(k){ if(sortKey===k)sortDir*=-1; else{sortKey=k;sortDir=1;} buildHead(); buildBody(); }
function buildBody(){
  const col=COLS.find(c=>c.k===sortKey);
  const rows=[...props].sort((a,b)=>{const va=col.sort(a),vb=col.sort(b);return (va<vb?-1:va>vb?1:0)*sortDir;});
  document.getElementById('tbody').innerHTML=rows.map(p=>`
    <tr onclick="openDetail('${p.id}')">
      <td><div class="t-bairro">${p.bairro}</div><div class="t-addr">${p.endereco.split(' - ')[0]}</div></td>
      <td class="num">${p.area_m2}</td>
      <td class="num">${p.quartos}</td>
      <td><div class="chips">${p.infra.map(i=>`<span class="chip">${i}</span>`).join('')||'<span class="chip">—</span>'}</div></td>
      <td class="t-total">${BRL.format(p.custo_total)}</td>
      <td>${p.visita?`<span class="tag yes">✓ ${fmtVisita(p)}</span>`:'<span class="tag no">não</span>'}</td>
      <td>${p.proposta?'<span class="tag prop">definida</span>':'<span class="tag prop empty">—</span>'}</td>
    </tr>`).join('');
}

  if(openAgencyId===id && document.getElementById('overlay').classList.contains('open')) openAgency(id);
}
function domainOf(u){ try{ return new URL(u).hostname.replace(/^www\./,''); }catch(e){ return ''; } }
function agencyProps(a){ const d=domainOf(a.site); return d?props.filter(p=>{const pd=domainOf(p.link); return pd&&(pd===d||pd.endsWith('.'+d)||d.endsWith('.'+pd));}):[]; }
function stClass(s){ return 'st-'+String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,''); }
function stTag(s){ return s?`<span class="tag ${stClass(s)}">${s}</span>`:'<span class="tag no">—</span>'; }
function statusSelect(a){
  return `<select class="st-select ${stClass(a.status)}" title="Alterar status" onclick="event.stopPropagation()" onchange="setAgencyStatus('${a.id}',this.value)">`
    + STATUSES.map(s=>`<option ${s===a.status?'selected':''}>${s}</option>`).join('')
    + `</select>`;
}

const AG_COLS=[
  {k:'nome',label:'Imobiliária',sort:a=>a.nome.toLowerCase()},
  {k:'regioes',label:'Regiões'},
  {k:'atua',label:'Atua'},
  {k:'imoveis',label:'Imóveis',sort:a=>agencyProps(a).length},
  {k:'status',label:'Status',sort:a=>a.status||''},
  {k:'contato',label:'Contato'}
];
let agSortKey='nome',agSortDir=1;
function agBuildHead(){
  document.getElementById('thead-ag').innerHTML=AG_COLS.map(c=>{
    const on=c.k===agSortKey?'sorted':'';
    const arr=c.sort?`<span class="arr">${c.k===agSortKey?(agSortDir>0?'▲':'▼'):'⇅'}</span>`:'';
    return `<th class="${c.sort?'sortable':''} ${on}" ${c.sort?`onclick="agSortBy('${c.k}')"`:''}>${c.label}${arr}</th>`;
  }).join('');
}
function agSortBy(k){ if(agSortKey===k)agSortDir*=-1; else{agSortKey=k;agSortDir=1;} agBuildHead(); agBuildBody(); }
function agBuildBody(){
  const col=AG_COLS.find(c=>c.k===agSortKey);
  const rows=[...ags].sort((a,b)=>{const va=col.sort(a),vb=col.sort(b);return (va<vb?-1:va>vb?1:0)*agSortDir;});
  document.getElementById('tbody-ag').innerHTML=rows.map(a=>{
    const n=agencyProps(a).length;
    const contato=a.contato||(a.telefone?formatTel(a.telefone):'');
    return `
    <tr onclick="openAgency('${a.id}')">
      <td><div class="t-bairro">${a.nome}</div><div class="t-addr">${domainOf(a.site)||'—'}</div></td>
      <td><div class="chips">${(a.regioes||[]).map(r=>`<span class="chip">${r}</span>`).join('')||'<span class="chip">—</span>'}</div></td>
      <td><div class="chips">${(a.atua||[]).map(r=>`<span class="chip">${r}</span>`).join('')||'<span class="chip">—</span>'}</div></td>
      <td class="t-count ${n?'':'zero'}">${n}</td>
      <td>${statusSelect(a)}</td>
      <td>${contato||'<span class="tag no">—</span>'}</td>
    </tr>`;
  }).join('');
}
function buildAgencies(){ const ov=loadStatusOverrides(); ags.forEach(a=>{ if(ov[a.id]) a.status=ov[a.id]; }); agBuildHead(); agBuildBody(); }

function openAgency(id){
  const a=ags.find(x=>x.id===id); if(!a) return;
  openAgencyId=id;
  const linked=agencyProps(a);
  const wa=a.telefone?`https://wa.me/${a.telefone}`:null;
  document.getElementById('panel').innerHTML=`
    <div class="p-head">
      <button class="p-close" onclick="closeDetail()">×</button>
      <div class="p-bairro">Imobiliária · ${stTag(a.status)}</div>
      <h2 class="p-addr">${a.nome}</h2>
    </div>
    <div class="p-body">
      <div class="sec"><h3>Status da pesquisa</h3>
        <select class="status-select ${stClass(a.status)}" onchange="setAgencyStatus('${a.id}', this.value)">
          ${STATUSES.map(s=>`<option value="${s}" ${s===a.status?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="sec"><h3>Contato</h3>
        <div class="kv"><span class="k">Site</span><span class="v">${a.site?`<a class="a-site" href="${a.site}" target="_blank" rel="noopener">${domainOf(a.site)}</a>`:'—'}</span></div>
        <div class="kv"><span class="k">Corretor</span><span class="v">${a.contato||'—'}</span></div>
        <div class="kv"><span class="k">Telefone</span><span class="v">${a.telefone?formatTel(a.telefone):'—'}</span></div>
      </div>
      <div class="sec"><h3>Regiões que atende</h3>
        <div class="p-chips">${(a.regioes||[]).map(r=>`<span class="chip">${r}</span>`).join('')||'<span class="chip">—</span>'}</div>
      </div>
      <div class="sec"><h3>Atuação</h3>
        <div class="p-chips">${(a.atua||[]).map(r=>`<span class="chip">${r}</span>`).join('')||'<span class="chip">—</span>'}</div>
      </div>
      <div class="sec"><h3>Imóveis desta imobiliária (${linked.length})</h3>
        ${linked.length?`<div class="p-linklist">${linked.map(p=>`
          <div class="p-linkitem" onclick="openDetail('${p.id}')">
            <span class="li-b">${p.bairro} · ${p.endereco.split(' - ')[0]}</span>
            <span class="li-t">${BRL.format(p.custo_total)}</span>
          </div>`).join('')}</div>`:'<div class="comment">Nenhum imóvel cadastrado desta imobiliária ainda.</div>'}
      </div>
      <div class="sec"><h3>Comentários</h3>
        <div class="comment">${a.comentarios||'—'}</div>
      </div>
      <div class="actions">
        ${a.site?`<a class="btn primary" href="${a.site}" target="_blank" rel="noopener">${ICON.link} Site</a>`:''}
        ${wa?`<a class="btn" href="${wa}" target="_blank" rel="noopener">${ICON.wa} WhatsApp</a>`:''}
      </div>
    </div>`;
  document.getElementById('overlay').classList.add('open');
}

buildHead(); buildBody(); buildAgencies();
try{
  if(typeof L==='undefined') throw new Error('Leaflet não carregou (CDN bloqueado?)');
  initMap();
}catch(err){
  console.error('Mapa indisponível:',err);
  const el=document.getElementById('map');
  if(el) el.innerHTML='<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:8px;color:var(--muted);text-align:center;padding:24px">'
    +'<div style="font-weight:600;color:var(--ink)">Mapa indisponível</div>'
    +'<div style="font-size:12.5px;max-width:340px">Não foi possível carregar o Leaflet/tiles (sem internet ou CDN bloqueado). A lista em <b>Tabela</b> funciona normalmente.</div></div>';
}
</script>
</body>
</html>
